services:
  auth:
    build: .
    restart: unless-stopped
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Fill GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Fill GOOGLE_CLIENT_SECRET in .env}
      PUBLIC_URL: https://${SYNC_DOMAIN:?Fill SYNC_DOMAIN in .env}/
    expose:
      - "8788"
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SYNC_DOMAIN: ${SYNC_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - auth
volumes:
  caddy_data:
  caddy_config:
