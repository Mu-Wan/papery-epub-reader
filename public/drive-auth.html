<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Papery · 连接 Google Drive</title>
<style>body{margin:0;background:#f5f3ee;color:#292823;font:16px/1.8 system-ui,sans-serif}main{max-width:540px;margin:10vh auto;padding:28px}h1{font-size:27px}button,a.action{display:block;box-sizing:border-box;width:100%;padding:12px;margin:14px 0;border:0;border-radius:10px;background:#262924;color:white;text-align:center;font:inherit;cursor:pointer;text-decoration:none}button:disabled{opacity:.5}small{color:#666;overflow-wrap:anywhere}textarea{box-sizing:border-box;width:100%;height:100px}#status{padding:12px;background:#e8e8e0;border-radius:8px}[hidden]{display:none!important}</style></head>
<body><main><small>PAPERY READER</small><h1>连接 Google Drive</h1><p>使用 Google 账号授权，仅访问 Papery 的应用数据。书籍直接在阅读器和 Google Drive 之间传输。</p><p id="status" role="status">正在加载 Google 授权组件…</p><small id="client"></small><button id="connect" disabled>选择 Google 账号</button><section id="result" hidden><a id="return" class="action">返回 Papery 完成连接</a><p>如果浏览器没有打开应用，可复制下方加密连接码，回到阅读器的“粘贴连接码”中完成连接。请保持阅读器打开。</p><textarea id="code" readonly aria-label="加密连接码"></textarea><button id="copy">复制连接码</button></section><p><small>本页面不保存授权令牌，也不需要客户端密钥。授权结果仅能由发起连接的阅读器解密，有效期为 10 分钟。</small></p></main><script type="module" src="./drive-auth.mjs"></script></body></html>
